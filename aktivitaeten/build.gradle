plugins {
	id 'net.fabricmc.fabric-loom-remap'
}

base {
	archivesName = project.archives_base_name
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Mod Menu nur für den Einstellungs-Knopf, optional. Die JAR liegt lokal in libs/ (nicht im Repository).
	modCompileOnly files("libs/modmenu-17.0.0.jar")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "aktivitaeten-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// Testlauf auch ohne Ottonien-Server
def gameTestConfigDir = file("build/run/clientGameTest/config")
tasks.named("runClientGameTest") {
	doFirst {
		def dir = gameTestConfigDir
		dir.mkdirs()
		new File(dir, "aktivitaeten.json").text = '{"hudEnabled":true,"onlyOnOttonien":false}'
	}
}
