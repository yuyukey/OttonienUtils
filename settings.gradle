pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
	plugins {
		id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	}
}

rootProject.name = 'OttonienUtils'

// Jede Mod liegt in einem eigenen Ordner
include 'minentimer'
include 'lehenskarte'
include 'aktivitaeten'
