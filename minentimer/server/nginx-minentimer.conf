# Nur nötig, wenn auf dem Server schon nginx läuft (statt Caddy).
# Nach /etc/nginx/sites-available/minentimer kopieren, verlinken, dann: certbot --nginx -d minen.vprondzinski.de
# Braucht zusätzlich nginx-ratelimit.conf in /etc/nginx/conf.d/.
server {
	listen 80;
	listen [::]:80;
	server_name minen.vprondzinski.de;

	client_max_body_size 300k;

	location / {
		limit_req zone=minentimer burst=30 nodelay;
		proxy_pass http://127.0.0.1:8765;
		proxy_set_header Host $host;
	}
}
